<button type="button" class="clinic-skip-link" (click)="skipToContent.emit()">Skip to content</button>

<div class="clinic-brand">
  <span class="clinic-brand-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" />
    </svg>
  </span>
  <div><span class="clinic-brand-name">InnoClinic</span><span class="clinic-brand-caption">Administration</span></div>
</div>

@if (navItems().length > 0) {
  <nav class="clinic-nav" aria-label="Primary">
    @for (item of navItems(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="clinic-nav-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @switch (item.path) {
            @case ('/my-schedule') {
              <rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4m8-4v4M3 10h18m-12 5h2m3 0h2" />
            }
            @case ('/appointments') {
              <rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4m8-4v4M3 10h18m-12 5h2m3 0h2" />
            }
            @case ('/doctors') {
              <path d="M5 4v6a5 5 0 0 0 10 0V4M4 4h2m8 0h2m-6 11v2a4 4 0 1 0 8 0v-2" /><circle cx="18" cy="13" r="2" />
            }
            @case ('/receptionists') {
              <rect x="3" y="5" width="18" height="14" rx="3" /><circle cx="9" cy="10" r="2" /><path d="M6 15a3 3 0 0 1 6 0m3-5h3m-3 4h3" />
            }
            @case ('/offices') {
              <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16m0-13h3a1 1 0 0 1 1 1v12M9 7h2m-2 4h2m-2 4h2" />
            }
            @case ('/services') {
              <rect x="3" y="6" width="18" height="15" rx="3" /><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m-7 7h6m-3-3v6" />
            }
            @case ('/specializations') {
              <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5m-18 4 9 5 9-5" />
            }
          }
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>
}

<header class="clinic-topbar">
  <span class="clinic-topbar-title">Clinic workspace</span>
  <div class="clinic-account">
    @if (email()) {
      <span class="clinic-avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="clinic-email" [title]="email()">{{ email() }}</span>
    }

    @if (canViewProfile()) {
      <button type="button" class="clinic-button clinic-button-outlined" (click)="onOpenProfile()" aria-label="Open profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3" /><path d="M5 20v-2a7 7 0 0 1 14 0v2" />
        </svg>
        Profile
      </button>
    }

    <button type="button" class="clinic-button clinic-button-text" (click)="onSignOut()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 17v3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5v3m-2 5h13m-4-4 4 4-4 4" />
      </svg>
      Sign out
    </button>
  </div>
</header>
