<section
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-xl bg-white shadow-xl"
>
  @if (hasHeader()) {
    <header class="flex items-start justify-between gap-4 border-b border-gray-200 px-4 py-4 sm:px-6">
      <div class="min-w-0">
        @if (title().length > 0) {
          <h2 [id]="titleId" class="truncate text-lg font-semibold text-gray-900">
            {{ title() }}
          </h2>
        }
        @if (subtitle(); as text) {
          <p class="mt-1 text-sm text-gray-500">{{ text }}</p>
        }
      </div>

      @if (showClose()) {
        <button
          type="button"
          (click)="onClose()"
          [attr.aria-label]="closeLabel()"
          class="inline-flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-md text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </header>
  }

  <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6">
    <ng-content />
  </div>

  <footer
    class="flex flex-col-reverse gap-3 border-t border-gray-200 px-4 py-4 sm:flex-row sm:items-center sm:justify-end sm:px-6"
  >
    <ng-content select="[dialogFooter]" />
  </footer>
</section>
