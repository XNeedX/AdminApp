<div class="w-full max-w-md space-y-4 rounded-lg bg-white p-6 shadow-xl">
  <div class="flex items-start gap-3">
    <div
      class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
    </div>
    <div class="flex-1">
      <p
        id="cancel-confirm-dialog-message"
        class="text-base font-medium leading-snug text-gray-800"
        role="alert"
      >
        {{ message }}
      </p>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      (click)="onCancel()"
      class="cursor-pointer rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      {{ cancelText }}
    </button>
    <button
      type="button"
      (click)="onConfirm()"
      class="cursor-pointer rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
    >
      {{ confirmText }}
    </button>
  </div>
</div>
