<div
  class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-end gap-2 sm:inset-x-auto sm:right-6 sm:bottom-6"
  aria-live="polite"
>
  @for (toast of toasts(); track toast.id) {
    <div
      role="status"
      class="pointer-events-auto flex w-full items-start gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white shadow-lg sm:w-auto sm:max-w-sm"
      [class]="toast.kind === 'success' ? 'bg-green-600' : 'bg-red-600'"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        class="shrink-0 rounded p-0.5 text-white/80 transition hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        aria-label="Dismiss notification"
        (click)="dismiss(toast.id)"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  }
</div>
