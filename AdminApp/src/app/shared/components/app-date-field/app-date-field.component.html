<label [for]="id()" class="block text-sm font-medium text-gray-700">
  {{ label() }}
</label>

<input
  [id]="id()"
  type="date"
  [value]="value()"
  [attr.min]="min()"
  [attr.max]="max()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  [disabled]="disabled()"
  (input)="onInput($event)"
  [class]="inputClasses()"
/>
