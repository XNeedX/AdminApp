<div class="min-h-screen bg-gray-50 p-4 md:p-8">
  <div class="mx-auto max-w-4xl space-y-6">
    @if (isReceptionistRoute()) {
      <a
        routerLink="/doctors"
        class="inline-flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
      >
        <span aria-hidden="true">в†ђ</span>
        Back to Doctors
      </a>
    }

    @if (isLoading()) {
      <div
        class="flex items-center justify-center rounded-xl border border-gray-200 bg-white p-12 shadow-sm"
        role="status"
        aria-live="polite"
      >
        <span class="text-sm text-gray-500">Loading profile…</span>
      </div>
    } @else if (loadError(); as error) {
      <div class="rounded-xl border border-red-200 bg-white p-6 shadow-sm" role="alert">
        <h2 class="text-lg font-semibold text-gray-900">Could not load the profile</h2>
        <p class="mt-1 text-sm text-gray-600">{{ error }}</p>
        <button
          type="button"
          (click)="reload()"
          class="mt-4 inline-flex cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          Try again
        </button>
      </div>
    } @else if (isEditMode()) {
      <app-doctor-form
        [mode]="mode"
        [form]="form"
        [specializations]="specializations()"
        [offices]="offices()"
        [formError]="formError()"
        [showPhoto]="true"
        [photoPreview]="editPhotoUrl()"
        [photoError]="photoError()"
        (photoSelected)="onPhotoSelected($event)"
        (photoRemoved)="onPhotoRemoved()"
        [isSubmitting]="isSaving()"
        [canSubmit]="canSubmit()"
        (submitted)="save()"
        (cancelled)="cancelEdit()"
        (specializationSelected)="onSpecializationSelected($event)"
        (officeSelected)="onOfficeSelected($event)"
      />
    } @else {
      <app-profile-view [profile]="profile()" [photoUrl]="photoUrl()" (edit)="enterEditMode()" />
    }
  </div>
</div>
