<div class="min-h-screen bg-gray-50 p-4 sm:p-6 md:p-8">
  <div class="mx-auto max-w-7xl space-y-6">
    <div class="flex flex-col gap-4 rounded-xl border border-gray-200 bg-white p-6 shadow-sm sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Appointments</h1>
        <p class="mt-1 text-sm text-gray-500">
          Generate the daily schedule, review appointments, approve them or cancel them.
        </p>
      </div>
    </div>

    @if (isLoadingCatalogs()) {
      <p class="text-sm text-gray-500" role="status" aria-live="polite">
        Loading filters…
      </p>
    } @else if (catalogError(); as error) {
      <div class="rounded-xl border border-red-200 bg-red-50 p-4" role="alert">
        <p class="text-sm font-semibold text-red-800">Could not load the appointment catalogs.</p>
        <p class="mt-1 text-sm text-red-700">{{ error }}</p>
        <button
          type="button"
          (click)="retryCatalogs()"
          class="mt-3 inline-flex cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          Try again
        </button>
      </div>
    }

    <app-appointment-filters
      [state]="filters()"
      [specializations]="catalogs().specializations"
      [services]="catalogs().services"
      [doctors]="catalogs().doctors"
      [offices]="catalogs().offices"
      [isLoading]="isLoading()"
      (generate)="onGenerate()"
      (filterChange)="onFiltersChange($event)"
      (dateChange)="onDateChange($event)"
      (createRequested)="onCreateRequested()"
    />

    <app-appointment-table
      [rows]="rows()"
      [isLoading]="isLoading()"
      [hasGenerated]="filters().hasGenerated"
      [loadError]="loadError()"
      (approve)="onApprove($event)"
      (cancel)="onCancel($event)"
    />
  </div>

  @if (isCreateOpen()) {
    <app-appointment-create-modal
      (created)="onAppointmentCreated()"
      (closed)="onModalClosed()"
    />
  }
</div>
