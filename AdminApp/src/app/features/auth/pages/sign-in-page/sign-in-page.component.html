<div
  class="flex min-h-screen items-center justify-center bg-slate-900/70 px-4 py-8 sm:px-6"
  role="dialog"
  aria-modal="true"
  aria-labelledby="sign-in-title"
>
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl sm:p-8">
    <div class="mb-6 flex flex-col gap-1">
      <h1 id="sign-in-title" class="text-2xl font-semibold text-gray-900">Sign in</h1>
      <p class="text-sm text-gray-500">Use your clinic account to continue.</p>
    </div>

    @if (form(); as signInForm) {
      <app-sign-in-form
        [form]="signInForm"
        [submitting]="isBusy()"
        [submitError]="submitError()"
        (submitted)="onSubmit()"
        (fieldChanged)="onFieldChanged()"
      />
    }
  </div>
</div>
