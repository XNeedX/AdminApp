<div
  class="clinic-auth-layout"
  role="dialog"
  aria-modal="true"
  aria-labelledby="sign-in-title"
>
  <div class="clinic-auth-panel">
    <div class="clinic-auth-brand">
      <span class="clinic-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" />
        </svg>
      </span>
      <div><span class="clinic-brand-name">InnoClinic</span><span class="clinic-brand-caption">Administration</span></div>
    </div>
    <div class="clinic-auth-form">
      <div class="mb-6 flex flex-col gap-1">
        <h1 id="sign-in-title">Sign in</h1>
        <p class="text-sm text-gray-500">Use your clinic account to continue.</p>
      </div>

      @if (form(); as signInForm) {
        <app-sign-in-form
          [form]="signInForm"
          [submitting]="isBusy()"
          [submitError]="submitError()"
          (submitted)="onSubmit()"
          (fieldChanged)="onFieldChanged()"
        />
      }
    </div>
  </div>
</div>
