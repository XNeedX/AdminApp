<form
  class="flex flex-col gap-5"
  [formGroup]="form()"
  novalidate
  (ngSubmit)="onSubmit()"
  (input)="onFieldChanged()"
>
  <div class="flex flex-col gap-1.5">
    <label for="sign-in-email" class="text-sm font-medium text-gray-700">E-mail</label>
    <input
      id="sign-in-email"
      #emailInput
      type="email"
      formControlName="email"
      autocomplete="username"
      inputmode="email"
      placeholder="name@clinic.com"
      class="w-full rounded-lg border px-3 py-2.5 text-sm text-gray-900 shadow-sm transition placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-0"
      [class]="
        emailError
          ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
          : 'border-gray-300 focus:border-blue-500 focus:ring-blue-200'
      "
      [attr.aria-invalid]="emailError ? true : null"
      [attr.aria-describedby]="emailError ? 'sign-in-email-error' : null"
    />
    @if (emailError) {
      <p id="sign-in-email-error" class="text-sm font-medium text-red-600" role="alert">
        {{ emailError }}
      </p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="sign-in-password" class="text-sm font-medium text-gray-700">Password</label>
    <div class="relative">
      <input
        id="sign-in-password"
        [type]="passwordType()"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-lg border py-2.5 pl-3 pr-11 text-sm text-gray-900 shadow-sm transition placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-0"
        [class]="
          passwordError
            ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
            : 'border-gray-300 focus:border-blue-500 focus:ring-blue-200'
        "
        [attr.aria-invalid]="passwordError ? true : null"
        [attr.aria-describedby]="passwordError ? 'sign-in-password-error' : null"
      />
      <button
        type="button"
        class="absolute inset-y-0 right-0 flex w-10 items-center justify-center rounded-r-lg text-gray-500 transition hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()"
      >
        @if (passwordVisible()) {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
            />
          </svg>
        } @else {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1 1 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178a1 1 0 010 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
      </button>
    </div>
    @if (passwordError) {
      <p id="sign-in-password-error" class="text-sm font-medium text-red-600" role="alert">
        {{ passwordError }}
      </p>
    }
  </div>

  @if (submitError()) {
    <p class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-700" role="alert">
      {{ submitError() }}
    </p>
  }

  <button
    type="submit"
    class="inline-flex w-full items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-blue-300"
    [disabled]="isSubmitDisabled"
  >
    {{ submitting() ? 'Signing in…' : 'Sign in' }}
  </button>
</form>
