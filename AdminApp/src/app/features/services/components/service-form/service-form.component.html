<form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div>
    <label for="service-name" class="block text-sm font-medium text-gray-700">Service name</label>
    <input
      id="service-name"
      type="text"
      formControlName="name"
      autocomplete="off"
      class="mt-1 block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      [class.border-gray-300]="!isShown('name')"
      [class.border-red-500]="isShown('name')"
      [attr.aria-invalid]="isShown('name')"
      [attr.aria-describedby]="isShown('name') ? 'service-name-error' : null"
      aria-required="true"
    />
    @if (nameMessage(); as message) {
      <p id="service-name-error" role="alert" class="mt-1 text-sm text-red-600">{{ message }}</p>
    }
  </div>

  <div>
    <label for="service-price" class="block text-sm font-medium text-gray-700">Price</label>
    <input
      id="service-price"
      type="number"
      step="0.01"
      min="0.01"
      formControlName="price"
      inputmode="decimal"
      class="mt-1 block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      [class.border-gray-300]="!isShown('price')"
      [class.border-red-500]="isShown('price')"
      [attr.aria-invalid]="isShown('price')"
      [attr.aria-describedby]="isShown('price') ? 'service-price-error' : null"
      aria-required="true"
    />
    @if (priceMessage(); as message) {
      <p id="service-price-error" role="alert" class="mt-1 text-sm text-red-600">{{ message }}</p>
    }
  </div>

  <div>
    <label for="service-category" class="block text-sm font-medium text-gray-700">
      Service category
    </label>
    <select
      id="service-category"
      formControlName="category"
      class="mt-1 block w-full rounded-md border bg-white px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      [class.border-gray-300]="!isShown('category')"
      [class.border-red-500]="isShown('category')"
      [attr.aria-invalid]="isShown('category')"
      [attr.aria-describedby]="isShown('category') ? 'service-category-error' : null"
      aria-required="true"
    >
      <option value="">Select a category</option>
      @for (option of categoryOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    @if (categoryMessage(); as message) {
      <p id="service-category-error" role="alert" class="mt-1 text-sm text-red-600">{{ message }}</p>
    }
  </div>

  <fieldset>
    <legend class="block text-sm font-medium text-gray-700">Status</legend>
    <div class="mt-2 flex flex-wrap gap-6">
      @for (status of statusOptions; track status) {
        <label class="inline-flex cursor-pointer items-center gap-2 text-sm text-gray-700">
          <input
            type="radio"
            formControlName="status"
            [value]="status"
            class="h-4 w-4 border-gray-300 text-blue-600 focus:ring-blue-500"
          />
          <span>{{ status }}</span>
        </label>
      }
    </div>
  </fieldset>

  <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:justify-end">
    <button
      type="button"
      (click)="onCancel()"
      [disabled]="submitting()"
      class="cursor-pointer rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Cancel
    </button>
    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="cursor-pointer rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ mode() === 'edit' ? 'Save changes' : 'Confirm' }}
    </button>
  </div>
</form>
