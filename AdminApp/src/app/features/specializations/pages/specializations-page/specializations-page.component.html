<section class="clinic-page" aria-labelledby="section-title">
  <header class="clinic-page-header">
    <div>
      <h1 id="section-title">Specializations</h1>
      <p>
        Manage the clinic's medical specializations and their services
      </p>
    </div>
    <button
      type="button"
      (click)="onCreate()"
      class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      <svg
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4"
        />
      </svg>
      Create specialization
    </button>
  </header>

  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    @if (isLoading()) {
      <div class="flex items-center justify-center p-12" role="status" aria-live="polite">
        <span class="text-sm text-gray-500">Loading specializations...</span>
      </div>
    } @else if (loadError(); as error) {
      <div class="p-6" role="alert">
        <p class="text-sm font-medium text-red-700">Could not load the specializations.</p>
        <p class="mt-1 text-sm text-gray-600">{{ error }}</p>
        <button
          type="button"
          (click)="retry()"
          class="mt-4 inline-flex cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          Retry
        </button>
      </div>
    } @else if (isEmpty()) {
      <p class="p-12 text-center text-sm text-gray-500">No specializations yet.</p>
    } @else {
      <app-specialization-table
        [rows]="rows()"
        [statusSavingId]="statusSavingId()"
        (open)="onOpen($event)"
        (statusChange)="onStatusChange($event)"
      />
    }
  </div>
</section>
