<div class="w-full max-w-3xl space-y-4 rounded-lg bg-white p-5 shadow-xl sm:p-6">
  <div>
    <h2 id="specialization-create-dialog-title" class="text-lg font-semibold text-gray-900">
      {{ title }}
    </h2>
    <p class="mt-1 text-sm text-gray-500">
      Add the specialization details and at least one service.
    </p>
  </div>

  @if (partialNotice(); as notice) {
    <p
      class="rounded-md border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800"
      role="alert"
    >
      {{ notice }}
    </p>
  }

  <app-specialization-form
    mode="create"
    [submitting]="submitting()"
    (submitted)="onSubmit($event)"
    (cancelled)="onCancel()"
  />
</div>
