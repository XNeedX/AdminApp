<section class="space-y-6">
  <header class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Receptionist profile</h1>
      <p class="mt-1 text-sm text-gray-500">
        View the staff record, or switch to Edit to update the personal details and office.
      </p>
    </div>

    <button
      type="button"
      (click)="backToList()"
      class="inline-flex cursor-pointer items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm transition-colors hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
    >
      Back to list
    </button>
  </header>

  @if (isLoading()) {
    <div
      class="rounded-xl border border-gray-200 bg-white p-12 shadow-sm"
      role="status"
      aria-live="polite"
    >
      <p class="text-center text-sm text-gray-500">Loading receptionist…</p>
    </div>
  } @else if (loadError(); as error) {
    <div class="rounded-xl border border-red-200 bg-red-50 p-6" role="alert">
      <p class="text-sm font-medium text-red-800">{{ error }}</p>
      <div class="mt-4 flex flex-wrap gap-3">
        <button
          type="button"
          (click)="loadProfile()"
          class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          Try again
        </button>
        <button
          type="button"
          (click)="backToList()"
          class="cursor-pointer rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm transition-colors hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
        >
          Back to Receptionists
        </button>
      </div>
    </div>
  } @else if (isEditMode()) {
    <app-receptionist-form
      [form]="form"
      [isEditMode]="isEditMode()"
      [offices]="offices()"
      [photoPreview]="photoPreview()"
      [photoError]="photoError()"
      [formError]="formError()"
      [isSubmitting]="isSaving()"
      [canSubmit]="canSubmit()"
      (submitted)="save()"
      (cancelled)="cancelEdit()"
      (photoSelected)="onPhotoSelected($event)"
      (photoCleared)="onPhotoCleared()"
      (officeSelected)="onOfficeSelected($event)"
    />
  } @else {
    <app-receptionist-profile-view [profile]="profile()" (edit)="enterEdit()" />
  }
</section>
