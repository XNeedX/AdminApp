<section class="clinic-page" aria-labelledby="section-title">
  <header class="clinic-page-header">
    <div>
      <h1 id="section-title">Receptionists</h1>
      <p>
        Clinic front-desk staff, their contact profiles and assigned offices.
      </p>
    </div>

    <button
      type="button"
      (click)="openCreateDialog()"
      class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
    >
      Create receptionist
    </button>
  </header>

  <app-receptionist-table
    [rows]="rows()"
    [isLoading]="isLoading()"
    [loadError]="loadError()"
    [deletingId]="deletingId()"
    (profileRequested)="openProfile($event)"
    (deleteRequested)="requestDelete($event)"
    (retryRequested)="reload()"
  />
</section>
