<div class="max-h-[90vh] w-full max-w-3xl overflow-y-auto">
  <app-receptionist-form
    [form]="form"
    [isEditMode]="isEditMode"
    [offices]="offices()"
    [photoPreview]="photoPreview()"
    [photoError]="photoError()"
    [formError]="formError()"
    [isSubmitting]="isSubmitting()"
    [canSubmit]="canSubmit()"
    (submitted)="submit()"
    (cancelled)="cancel()"
    (photoSelected)="onPhotoSelected($event)"
    (photoCleared)="onPhotoCleared()"
    (officeSelected)="onOfficeSelected($event)"
  />
</div>
